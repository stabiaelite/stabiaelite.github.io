<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Stabia Elite & Stabia Events — tutti i nostri link.">
  <title>Stabia Elite & Stabia Events</title>
  <style>
    :root{
      --black:#080808;
      --panel:#111111;
      --gold:#d5ad55;
      --gold-soft:#ead39a;
      --white:#faf9f6;
      --ink:#111111;
      --muted:#9b9b9b;
      --line:rgba(255,255,255,.12);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--black);
      color:var(--white);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    .page{max-width:760px;margin:0 auto}
    .section{
      min-height:100svh;
      padding:42px 22px 48px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .section + .section{border-top:1px solid var(--line)}
    .brand{
      text-align:center;
      margin-bottom:30px;
    }
    .brand.elite{
      width:min(250px,72vw);
      margin-left:auto;
      margin-right:auto;
      background:#000;
      border-radius:4px;
      overflow:hidden;
    }
    .brand.elite img{
      display:block;width:100%;height:auto;
    }
    .brand.events{
      width:min(330px,82vw);
      margin-left:auto;
      margin-right:auto;
      padding:20px 16px 12px;
      background:#fff;
      border-radius:18px;
    }
    .brand.events img{display:block;width:100%;height:auto}
    .eyebrow{
      text-align:center;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:10px;
      color:var(--muted);
      margin:0 0 18px;
    }
    .links{display:grid;gap:12px;width:min(460px,100%);margin:0 auto}
    .btn{
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:16px 20px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      background:rgba(255,255,255,.035);
      font-size:15px;
      font-weight:500;
      letter-spacing:.01em;
      transition:transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .btn:hover,.btn:focus-visible{
      transform:translateY(-1px);
      background:rgba(255,255,255,.075);
      border-color:rgba(255,255,255,.3);
      outline:none;
    }
    .btn.primary{
      background:var(--gold);
      border-color:var(--gold);
      color:#0a0a0a;
      font-weight:700;
    }
    .btn.primary:hover,.btn.primary:focus-visible{background:var(--gold-soft);border-color:var(--gold-soft)}
    .icon{width:19px;height:19px;display:inline-block;flex:0 0 auto}
    .note{
      text-align:center;
      color:#777;
      font-size:11px;
      margin-top:28px;
    }
    .footer{
      text-align:center;
      padding:20px 20px 30px;
      color:#555;
      font-size:10px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}.btn{transition:none}
    }
  </style>
</head>
<body>
<main class="page">

  <section class="section" id="stabia-elite" aria-label="Stabia Elite">
    <div class="brand elite">
      <img src="assets/stabia-elite.jpg" alt="Stabia Elite">
    </div>
    <p class="eyebrow">Stabia Elite</p>

    <nav class="links" aria-label="Link Stabia Elite">
      <a class="btn primary" href="https://eclipsianight.com/prenota.html" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect>
          <path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path>
        </svg>
        Prenotazioni
      </a>

      <a class="btn" href="https://www.instagram.com/stabiaelite" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
        Instagram
      </a>

      <a class="btn" href="https://www.tiktok.com/@stabievents_" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M14.2 3c.4 2.2 1.7 3.7 4 4v3.2c-1.5-.1-2.8-.6-4-1.4v6.4a5.8 5.8 0 1 1-5-5.7v3.3a2.5 2.5 0 1 0 1.8 2.4V3h3.2Z"></path>
        </svg>
        TikTok
      </a>
    </nav>
  </section>

  <section class="section" id="stabia-events" aria-label="Stabia Events">
    <div class="brand events">
      <img src="assets/stabia-events.png" alt="Stabia Events">
    </div>
    <p class="eyebrow">Stabia Events</p>

    <nav class="links" aria-label="Link Stabia Events">
      <a class="btn" href="https://www.instagram.com/stabiaevents_" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
        Instagram
      </a>

      <a class="btn" href="https://www.tiktok.com/@stabievents_" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M14.2 3c.4 2.2 1.7 3.7 4 4v3.2c-1.5-.1-2.8-.6-4-1.4v6.4a5.8 5.8 0 1 1-5-5.7v3.3a2.5 2.5 0 1 0 1.8 2.4V3h3.2Z"></path>
        </svg>
        TikTok
      </a>
    </nav>
    <p class="note">Seguici sui nostri canali social</p>
  </section>

  <div class="footer">Stabia Elite · Stabia Events</div>
</main>
</body>
</html>
